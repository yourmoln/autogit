<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>AutoGit · Agent 自动化 Git 工作流</title>
    <script>
      // Applies the stored theme before the first paint (mirrors src/lib/theme.ts).
      (() => {
        let mode = 'system';
        try {
          const stored = localStorage.getItem('autogit.theme');
          if (stored === 'light' || stored === 'dark') mode = stored;
        } catch {
          /* storage unavailable: fall back to the system setting */
        }
        const dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta
      name="description"
      content="AutoGit 通过 Codex CLI 驱动 GitHub / Gitea / Gitee 的 Issue → PR → 评审 → 修复自动化流水线"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M9 21.5 15 10l3 7 2-3.5h3' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
